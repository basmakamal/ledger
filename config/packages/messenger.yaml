framework:
    messenger:
        default_bus: command.bus

        buses:
            # Exactly one handler per command; an unroutable command is a bug.
            command.bus: ~
            # Events may legitimately have no subscriber yet.
            event.bus:
                default_middleware:
                    allow_no_handlers: true

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'

        routing:
            # Everything the aggregates record leaves the request that caused it.
            Ledger\Domain\Shared\DomainEvent: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
